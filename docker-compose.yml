services:
  db:
    image: postgres:16-alpine
    container_name: goipam-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-goipam}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-goipam}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - goipam-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: goipam-backend
    restart: unless-stopped
    environment:
      PORT: "8080"
      DB_HOST: "db"
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-goipam}
    cap_add:
      - NET_RAW
    sysctls:
      - net.ipv4.ping_group_range=0 2147483647
    depends_on:
      db:
        condition: service_healthy
    networks:
      - goipam-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: goipam-frontend
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    depends_on:
      - backend
    networks:
      - goipam-network

volumes:
  postgres_data:
    driver: local

networks:
  goipam-network:
    driver: bridge

